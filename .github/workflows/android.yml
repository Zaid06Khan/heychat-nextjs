name: Android APK

# Builds an installable debug APK and attaches it to the run as an artifact.
#
# WHY CI AND NOT A LOCAL BUILD. Building Android needs the Android SDK, and
# this project is developed on a Windows machine with no SDK, no Android Studio
# and no Gradle. A Linux runner has all three preinstalled, so the APK gets
# built without installing ~2GB of tooling to find out whether the app runs at
# all. It is also the same shape as the macOS workflow iOS will need.
#
# WHAT YOU GET. A *debug* APK, signed with Android's throwaway debug key. It
# installs on a phone with "install unknown apps" enabled. It is NOT the artifact
# you upload to Play — that needs a release build signed with a keystore you
# generate and keep, which is a separate job wired up when the Play account
# exists.

on:
  workflow_dispatch:
  push:
    branches: [master]
    # Only when something that affects the app actually changes. Documentation
    # commits should not spend build minutes.
    paths:
      - 'android/**'
      # `www/` is no longer here: it is BUILT now (npm run build:mobile) and
      # gitignored, so it can never change in a commit. What produces it is the
      # SPA source, the mobile shell and the Vite config — those are the paths
      # that should rebuild the app.
      - 'src/**'
      - 'mobile/**'
      - 'vite.config.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitor's Gradle wrapper wants a JDK; 21 matches what the project is
      # developed against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # THE BUNDLE, BEFORE THE SYNC. `www/` is Capacitor's webDir and is build
      # output now rather than a committed fallback page, so without this step
      # `cap sync` would copy an empty directory into the native project.
      #
      # NEXT_PUBLIC_API_ORIGIN is what the bundled client calls: from
      # capacitor://localhost a relative /api/... resolves inside the app
      # package. The Supabase values are public by design (the anon key grants
      # nothing on its own — RLS decides), and vite.config.mjs refuses to build
      # if a secret key is passed instead.
      - name: Build the mobile bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_API_ORIGIN: https://calamus3.vercel.app
        run: npm run build:mobile

      # `cap sync` copies webDir into the native project and refreshes plugins.
      # The WebView still loads the deployed site (server.url in
      # capacitor.config.json), so the bundle it packages is not what runs yet —
      # flipping that is one line, and it waits on CORS for the Capacitor origin.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact after the commit
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: calamus3-debug-${{ steps.meta.outputs.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------- release
      #
      # The debug APK above is for putting on a phone by hand. THIS is what Play
      # takes: an Android App Bundle, signed with the upload key.
      #
      # Every step here is gated on the keystore secret existing, so a fork — or
      # a run from before the key was created — still gets its debug APK instead
      # of a red build.
      #
      # The gate is a STEP OUTPUT, not a step-level `env`. A step's own `env` is
      # not in scope in its `if`, so gating on one silently skips the step and
      # the build goes green having produced nothing.
      - name: Is there a signing key?
        id: haskey
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; skipping the release bundle."
          fi

      - name: Decode the upload keystore
        id: keystore
        if: steps.haskey.outputs.found == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Written OUTSIDE the workspace so no build step can package it and
          # nothing can commit it by accident.
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        if: steps.haskey.outputs.found == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # versionCode comes from the run number, which only ever increases. Play
        # refuses a versionCode it has seen before and will not free it up even
        # after the release is deleted, so "remember to bump it" is a mistake
        # with a permanent cost.
        run: >
          ./gradlew bundleRelease --no-daemon --stacktrace
          -PcalamusVersionCode=${{ github.run_number }}
          -PcalamusVersionName=1.0.${{ github.run_number }}

      - name: Check the AAB is actually signed
        if: steps.haskey.outputs.found == 'true'
        # An unsigned bundle uploads and is rejected by Play with a message that
        # does not say "unsigned". Cheaper to find out here: a signed AAB has a
        # signature block under META-INF, an unsigned one does not.
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -qiE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "signed"
          else
            echo "AAB IS NOT SIGNED"
            unzip -l "$AAB" | head -30
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.haskey.outputs.found == 'true'
        with:
          name: calamus3-release-${{ github.run_number }}-${{ steps.meta.outputs.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Shred the keystore
        # `always()` so an earlier failure does not leave the key sitting on the
        # runner. Runners are ephemeral, but not depending on that is free.
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
