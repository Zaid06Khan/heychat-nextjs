apply plugin: 'com.android.application'

/**
 * SET BY CI, defaulting to a local build's values.
 *
 * Play refuses an upload whose versionCode is not higher than the last one, and
 * a used code is never freed — not even by deleting the release. The workflow
 * passes the GitHub run number, which only ever increases, so nobody has to
 * remember to bump anything.
 *
 * COMPUTED HERE, NOT INLINE IN defaultConfig, because Groovy parses
 * `versionCode (expr).toString().toInteger()` as
 * `versionCode(expr).toString().toInteger()` — the chain lands on the RESULT of
 * the setter rather than on the value. That handed versionCode a String and
 * failed the build with "Value is null", which names neither the property nor
 * the cause.
 */
def calamusVersionCode = (project.findProperty("calamusVersionCode") ?: "1").toString().toInteger()
def calamusVersionName = (project.findProperty("calamusVersionName") ?: "1.0").toString()

android {
    namespace = "app.calamus3.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.calamus3.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode calamusVersionCode
        versionName calamusVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * The UPLOAD key, read from the environment and never from a file in this
     * repo. CI decodes it from a secret into a path it then deletes.
     *
     * Absent — which is every local build — this block leaves the config with no
     * store file, and the release build below falls back to unsigned rather than
     * failing. That keeps `assembleDebug` and a local release build working on a
     * machine that has no business holding the key.
     */
    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only when there is something to sign with. Assigning the config
            // unconditionally makes a keyless build fail with a Gradle error
            // about a missing store file, which reads as a broken build script
            // rather than a missing secret.
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
